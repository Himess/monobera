fragment ValidatorMinimal on Validator {
  id
  publicKey
  amountDelegated: activeBoostAmount
}
fragment SubgraphStatusMeta on _Meta_ {
  block {
    timestamp
  }
  hasIndexingErrors
}

query GetUserValidatorInformation($address: Bytes!) {
  userValidatorInformations: userBoosts(
    where: { user: $address }
    first: 1000
  ) {
    id
    queuedBoosts: queuedBoostAmount
    activeBoosts: activeBoostAmount
    queuedUnboosts: queuedDropBoostAmount
    queuedUnboostStartBlock: queuedDropBoostStartBlock
    queuedBoostStartBlock: queuedBoostStartBlock
    user
    validator {
      ...ValidatorMinimal
    }
  }
  _meta {
    ...SubgraphStatusMeta
  }
}

query GetValidValidator($address: ID!) {
  validator(id: $address) {
    ...ValidatorMinimal
  }
}

query GetAllValidators {
  validators(first: 1000, orderDirection: desc, orderBy: activeBoostAmount) {
    ...ValidatorMinimal
  }
}

fragment ValidatorStakedBgts on BoostByValidator {
  allTimeBGTStaked: allTimeAmount
  BGTStaked: amount
  id
  timestamp
}

query GetValidatorBgtStaked($pubKey: String!, $timestamp: Timestamp!) {
  validatorBgtStaked: boostByValidators(
    interval: day
    where: { validator: $pubKey, timestamp_gte: $timestamp }
  ) {
    ...ValidatorStakedBgts
  }
}

fragment BlockRewardStatsByValidator on BlockRewardStatsByValidator {
  timestamp
  # rewardRate
  # commissionRate
  BGTEmitted: distributedBGTAmount
  BGTEarned: distributedBGTAmount
  allTimeBGTEmitted: allTimeDistributedBGTAmount
  allTimeBGTEarned: allTimeDistributedBGTAmount

  validator {
    ...ValidatorMinimal
  }
}

# this is prob an issue.
query GetValidatorBlockRewardStats($address: String!, $timestamp: Timestamp!) {
  blockRewardStatsByValidators(
    interval: day
    where: { validator: $address, timestamp_gte: $timestamp }
  ) {
    ...BlockRewardStatsByValidator
  }
}

query GetValidatorIncentivesReceiveds(
  $address: String!
  $timestamp: Timestamp!
) {
  incentiveDistributionByValidators(
    interval: day
    where: { validator: $address, timestamp_gte: $timestamp }
  ) {
    token {
      ...StakingToken
    }
    tokenReceived: receivedTokenAmount
    # usdValueTokenRewarded
    timestamp
    allTimeTokenReceived: allTimeReceivedTokenAmount
    # allTimeUsdValueTokenRewarded
    id
  }
  rewardsDistributionByValidators(
    interval: day
    where: { validator: $address }
    first: 1
  ) {
    # allTimeUsdValueTokenRewarded
    allTimeBGTDistributed: allTimeDistributedBGTAmount
  }
}

query GetValidatorBgtBoost($address: String!) {
  userValidatorBoostQueued: userBoosts(
    first: 10
    where: { validator: $address, queuedBoostAmount_gt: "0" }
    orderBy: queuedBoostAmount
    orderDirection: desc
  ) {
    amountQueued: queuedBoostAmount
    user
  }
  userValidatorBoostDeposited: userBoosts(
    first: 10
    where: { validator: $address, activeBoostAmount_gt: "0" }
    orderBy: activeBoostAmount
    orderDirection: desc
  ) {
    amountDeposited: activeBoostAmount
    user
  }
}

query GetValidatorBlockStats($address: String) {
  blockStatsByValidators(
    interval: hour
    first: 1
    where: { validator: $address }
  ) {
    allTimeBlockCount
  }
}

query GetAllValidatorBlockCount($timestamp: Timestamp) {
  blockStatsByValidators(
    interval: day
    first: 1000
    where: { timestamp: $timestamp }
  ) {
    allTimeBlockCount
    blockCount
    validator {
      id
      publicKey
    }
    timestamp
  }
}
fragment StakingToken on TokenInformation {
  address
  # beraValue
  decimals
  name
  symbol
  # usdValue
}

fragment VaultMinimal on Vault {
  id
  stakingTokenAmount
  address
  # activeIncentivesValueUsd
}

fragment VaultWithStakingToken on Vault {
  ...VaultMinimal
  stakingToken {
    ...StakingToken
  }
}

fragment GlobalInfo on GlobalInfo {
  totalValidators: totalValidatorsCount
  totalBGTStaked: totalActiveBoostAmount
  totalBGTQueued: totalQueuedBoostAmount
  totalBGTDistributed: totalDistributedAmount
  rewardRate
  id
  baseRewardRate
}

# TODO: we need to figure out what to do when we have 1000+ reward vaults and this query is wrong
query GetGauges {
  vaults(first: 1000, where: { isWhitelisted: true }) {
    ...VaultWithStakingToken
  }
}

query GetWeeklyBgtInflation($wbera: ID!) {
  globalRewardDistributions(interval: day, first: 7) {
    BGTDistributed: distributedBGTAmount
  }
  tokenInformation(id: $wbera) {
    ...StakingToken
  }
}

query GetRewardVault($stakingToken: String) {
  vaults(first: 1, where: { stakingToken: $stakingToken }) {
    ...VaultWithStakingToken
  }
}

query GetValidatorByOperator($operator: Bytes = "") {
  validators(where: { operator: $operator }) {
    publicKey
  }
}
